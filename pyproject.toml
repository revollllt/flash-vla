[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-vla"
version = "0.1.0"
description = "Hardware-specialized VLA inference targets built with TileLang and CUDA Graphs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tilelang", "cuda", "hopper", "gpu-kernels", "vla", "pi0", "pi05", "inference"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
]

dependencies = [
    "tilelang==0.1.11",
    "apache-tvm-ffi==0.1.11",
    "torch>=2.4",
]

[project.optional-dependencies]
pi05 = ["sentencepiece", "numpy", "safetensors"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
