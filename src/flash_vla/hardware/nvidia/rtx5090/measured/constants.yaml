# Machine constants for sm120-rtx5090.
#
# A RESULTS TABLE, not a lab notebook -- same contract as the sm90 table beside
# it. Each entry is: the number, the condition it holds under (`units`), the
# one-line answer (`short`), and the rule to apply (`rule`).
#
# THIS TABLE IS ALMOST EMPTY ON PURPOSE. Bring-up established what the machine's
# instruction set and static limits are; it has measured no bandwidth, no
# latency and no throughput. Every performance unit below is declared
# `unmeasured` so that `constants.py --validate` reports it as a GAP rather than
# letting a floor silently fall back to an H100 number. Nothing in the sm90
# table transfers -- different DRAM, different cache, different SM count, and a
# tensor core reached by a different instruction.
machine:
  id: sm120-rtx5090
  gpu: NVIDIA GeForce RTX 5090
  arch: sm120a
  sms: 170
  smem_per_cta_b: 101376
  smem_per_sm_b: 102400
  dram_peak_tbs: 1.792
  l2_mb: 96
  clocks_pinned: false
  noise_floor_pct: 6
  caution: 'Consumer Blackwell, not datacenter Blackwell: no wgmma and no tcgen05, so there is no asynchronous
    MMA on this part at all and every tensor-core mainloop is warp-level mma.sync. Shared memory per
    block is 99 KB against sm90''s 227, and max warps per SM is 48 against 64, so an sm90 tile budget
    overshoots both. Toolchain is CUDA 13.1 (V13.1.80), driver 580.142, PTX ISA 9.1 max. The `a` target
    is required: setmaxnreg, block-scaled mma and ldmatrix .m16n16 are refused on plain sm_120.'
units:
- id: isa
  status: measured
  probe: lab/sm120/ptx_support.py
  reference: isa-support.md
  covers: Which PTX instructions ptxas accepts for sm_90a, sm_120 and sm_120a, decided per instruction
    by assembling a minimal entry containing only that instruction. Establishes that wgmma and tcgen05
    are both absent, that TMA/mbarrier/cp.async/ldmatrix/PDL all survive, and which three features require
    the `a` target.
- id: limits
  status: measured
  probe: lab/sm120/cluster_dsmem.cu
  reference: isa-support.md
  covers: Static placement limits established by running rather than by reading a table -- the largest
    thread-block cluster that launches and exchanges distributed shared memory, and the largest dynamic
    shared-memory opt-in a block is granted.
- id: tma
  status: unmeasured
  probe: skill probes/units/tma_ring -- builds for sm_120a, not yet run here
  reference: none yet
  covers: 'Copy-engine delivery rate. Instructions all present; every sm90 number is void: GDDR7 at 1.792
    TB/s against HBM3 at 3.35, 96 MB of L2 against 50, 170 SMs against 132.'
- id: launch
  status: measured
  probe: lab/sm120/launch_unit.cu
  reference: unit-launch.md
  covers: 'What a launch costs before it moves a byte, and what a cold read costs per byte. Launch-to-launch
    interval against grid size (batched so per-launch event overhead is out of it), the cold-read cost
    model t = a + MB/b with L2 evicted before every launch, and the CTA count at which a cold read stops
    improving.'
- id: atomic
  status: unmeasured
  probe: skill probes/units/gmem_atomic -- no sm90-only construct, not yet run here
  reference: none yet
  covers: Global atomic throughput against instruction, width, scope and address placement, and the arrive->observe
    latency of a gmem counter.
- id: mma
  status: unmeasured
  probe: needs a new mma.sync-only probe; the skill's mma_rate is built on wgmma
  reference: none yet
  covers: 'Warp-level `mma.sync` issue rate, accumulator count to saturate, and the ldmatrix feed tax.
    The sm90 unit''s wgmma half has no counterpart here and `mma.xover.n.wgmma` has no meaning: there
    is no second instruction to cross over to.'
- id: coop
  status: unmeasured
  probe: skill probes/units/coop_launch -- no sm90-only construct, not yet run here
  reference: none yet
  covers: Cooperative launch grid_sync cost, placeable block count, and whether a grid barrier beats the
    relaunch it replaces.
constants:
- tag: cluster.count.max
  unit: limits
  value: 8
  units: CTAs per thread-block cluster that launch, cluster_sync and exchange DSMEM at 256 threads and
    1 KB of shared memory; 16 is refused with `cluster misconfiguration`, and `cudaOccupancyMaxPotentialClusterSize`
    independently returns 8
  short: cluster 8 works, 16 refused
  rule: Clusters and distributed shared memory are available on this part up to 8, so a DSMEM reduction
    ported from sm90 has a working substrate -- but its sm90 barrier cost does not transfer and must be
    measured before the reduction is assumed worthwhile.
- tag: smem.bytes.cta.max
  unit: limits
  value: 101376
  units: bytes of dynamic shared memory per block accepted by cudaFuncSetAttribute; 99 KB is accepted
    and 100 KB is refused with `invalid argument`
  short: 99 KB per block, hard
  rule: 'Budget tiles against 99 KB, not sm90''s 227: an inherited sm90 stage count overshoots by 2.29x
    and fails at launch rather than degrading. Pair it with 48 warps per SM, not 64.'
- tag: isa.wgmma.absent
  unit: isa
  value: 0
  units: wgmma instructions accepted on sm_120a, out of 5 tested (fence, commit_group, wait_group, mma_async
    bf16, mma_async fp8); ptxas refuses each with "not supported on .target 'sm_120a'", and tcgen05 is
    refused on the same target
  short: no wgmma, no tcgen05
  rule: Every tensor-core mainloop on this machine is warp-level `mma.sync`. Do not port a wgmma mainloop
    by changing its arch flag -- it does not assemble -- and do not carry across any sm90 constant whose
    subject is wgmma.
- tag: isa.target.a_required
  unit: isa
  value: 3
  units: instructions accepted on sm_120a but refused on sm_120 -- setmaxnreg.inc/.dec, mma with block
    scale, and ldmatrix .m16n16
  short: sm_120a required for setmaxnreg
  rule: 'Pin `sm_120f` in each Target''s compiler settings. Building plain sm_120 does not make warp specialisation
    slower, it makes `setmaxnreg` fail to assemble; and the family target `sm_120f` is identical to `sm_120a`
    on all 51 probed instructions while covering the whole GB20x family rather than one die, so the
    architecture-conditional target buys nothing here.'
- tag: launch.lat.dev.ramp
  unit: launch
  value: 2.05
  units: us per back-to-back launch of an empty kernel, 256 threads, measured as a 200-launch batch so
    per-launch event overhead is excluded; 1.96 at 1 CTA and 2.05 from 170 to 1024, i.e. FLAT in grid
    size. Bracketing a single launch with two events instead reads 2.34 (1.14x), which is the event cost,
    not the launch cost
  short: 2.05 us/launch, flat in grid
  rule: 'Launch COUNT is a first-class term in every fusion decision here, and a heavier one than on sm90:
    2.05 us against that machine''s 1.24, a 1.65x penalty per launch. Unlike sm90 there is no grid ramp
    to amortise -- one CTA costs the same as a thousand -- so a small launch is pure overhead.'
- tag: ld.bw.dev.dram
  unit: launch
  value: 1.539
  units: MB per us marginal (1.613 TB/s, 90% of the 1.792 TB/s datasheet peak) behind 3.93 us of fixed
    cost, fitted over 16-256 MB where the curve is linear, L2 flushed with twice its 96 MB before every
    launch, 680 CTAs x 256 threads. Fitting all 0.5-256 MB instead gives 3.45 + MB/1.532, understating
    the marginal rate because the small sizes are fixed-cost dominated
  short: 3.93us + MB/1.539
  fixed_us: 3.93
  rule: 'Replace bytes / 1.792 TB/s with 3.93 + MB/1.539 in every floor on this machine, per launch. Against
    sm90''s 1.85 + MB/2.77 the fixed cost is 2.1x worse and the marginal rate 1.80x worse, so a phase
    that was launch-bound on H100 is more launch-bound here, not less.'
- tag: ld.ctas.dev.knee
  unit: launch
  value: 340
  units: CTAs at which a cold 16 MB read reaches its best time (14.34 us); exactly 2x the 170 SMs, and
    flat from there to 2720
  short: knee @ 2x SM count
  derate_at_1x_sm: 1.55
  rule: 'Size a cold-streaming grid at 2x the SM count, not 1x: 170 CTAs cost 1.55x what 340 do for identical
    bytes, 85 cost 2.00x and 42 cost 3.29x. A grid sized to an output tiling alone will usually land below
    the knee.'
