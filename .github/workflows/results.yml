name: Published results integrity

on:
  pull_request:
    paths:
      - ".github/workflows/results.yml"
      - ".claude/skills/target-onboarding/assets/**"
      - "lab/results/**"
      - "lab/optimize/**"
      - "lab/onboarding.py"
      - "benchmarks/config.py"
      - "benchmarks/latency.py"
      - "eval/**"
      - "tools/profiling/floor.py"
      - "tests/test_identity*"
      - "tests/test_checkpoint_factory.py"
      - "tests/legacy/**"
      - "src/flash_vla/inference.py"
      - "src/flash_vla/environment.py"
      - "src/flash_vla/runtime/identity.py"
      - "src/flash_vla/runtime/registry.py"
      - "src/flash_vla/models/**"
      - "src/flash_vla/hardware/**/target.py"
      - "src/flash_vla/hardware/**/plans.py"
      - "src/flash_vla/hardware/**/spec.py"
      - "src/flash_vla/hardware/**/graph.py"
      - "src/flash_vla/hardware/**/__init__.py"
      - "results/**"
      - "pyproject.toml"
  push:
    paths:
      - ".github/workflows/results.yml"
      - ".claude/skills/target-onboarding/assets/**"
      - "lab/results/**"
      - "lab/optimize/**"
      - "lab/onboarding.py"
      - "benchmarks/config.py"
      - "benchmarks/latency.py"
      - "eval/**"
      - "tools/profiling/floor.py"
      - "tests/test_identity*"
      - "tests/test_checkpoint_factory.py"
      - "tests/legacy/**"
      - "src/flash_vla/inference.py"
      - "src/flash_vla/environment.py"
      - "src/flash_vla/runtime/identity.py"
      - "src/flash_vla/runtime/registry.py"
      - "src/flash_vla/models/**"
      - "src/flash_vla/hardware/**/target.py"
      - "src/flash_vla/hardware/**/plans.py"
      - "src/flash_vla/hardware/**/spec.py"
      - "src/flash_vla/hardware/**/graph.py"
      - "src/flash_vla/hardware/**/__init__.py"
      - "results/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/flash-vla-matplotlib
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[pi05]" "pytest>=9" "matplotlib==3.10.8"
      - name: Validate legacy consumers
        run: python -m pytest -q tests/legacy
      - name: Validate published facts
        run: python -m lab.results validate
      - name: Check deterministic generated results
        run: python -m lab.results rebuild --check
      - name: Ensure tracked results are unchanged
        run: git diff --exit-code -- results/
