# Machine constants for sm90-h100-sxm5.
#
# A RESULTS TABLE, not a lab notebook. Each entry is: the number, the condition
# it holds under (`units`), the one-line answer (`short`), and the rule to apply
# (`rule`). The measurement narrative that justified each number -- claim,
# valid, isolation, falsifier, and per-job provenance -- was removed on
# 2026-08-29; it is preserved outside the skill and in git history.
machine:
  id: sm90-h100-sxm5
  gpu: NVIDIA H100 80GB HBM3
  arch: sm90a
  sms: 132
  smem_per_cta_b: 232448
  smem_per_sm_b: 233472
  hbm_peak_tbs: 3.35
  l2_mb: 50
  clocks_pinned: false
  noise_floor_pct: 6
  caution: 'One machine, two toolchains: the tma unit is torch 2.13.0+cu130 (2026-08-25) and the launch
    unit is torch 2.11.0+cu130 (2026-08-20). They agree independently on ld.bw.dev.dram, which is the
    only cross-check between them. Do not combine a number from one with a number from the other without
    saying so.'
units:
- id: tma
  status: measured
  probe: probes/units/tma_ring/tma_ring.py
  reference: sm90/unit-tma.md
  covers: 'Copy-engine delivery rate: what one producer warp sustains, what ring stages buys, what box
    geometry costs, and where the saturation frontier sits in (CTAs x warps x bytes-per-TMA).'
- id: launch
  status: measured
  probe: none in-repo -- absorbed from tile-dataflow Phase 0 and its job logs
  reference: sm90/unit-launch.md
  covers: Per-launch grid ramp, cold streaming bandwidth vs transfer size and vs CTA count, cluster declaration
    and barrier cost, cluster placement limits, and the capacity-is-not-residency correction.
- id: atomic
  status: measured
  probe: probes/units/gmem_atomic/gmem_atomic.py
  reference: sm90/unit-atomic.md
  covers: Global atomic throughput as a function of instruction, width, scope, address placement and sharing,
    plus the arrive->observe latency of a gmem counter and how it scales with observers. Everything here
    resolves in L2, not DRAM.
- id: mma
  status: measured
  probe: probes/units/mma_rate/mma_rate.py
  reference: sm90/unit-mma.md
  covers: 'Both tensor-core instructions. For warpgroup `wgmma`: issue cadence against N, the in-flight
    stages and wait_group setting needed to fill the pipeline, whether a second math warpgroup buys anything,
    the sustained clock under load, and the bytes-per-ns ratio against the TMA unit. For warp-level `mma.sync`:
    issue rate, latency, the accumulator and warp counts that saturate it, and the output-tile size at
    which the two instructions cross over. Every rate is verified against a torch reference before it
    is reported.'
- id: coop
  status: measured
  probe: probes/units/coop_launch/coop_launch.py
  reference: sm90/unit-coop.md
  covers: 'Cooperative launch: what one cooperative_groups grid_sync costs against grid size, how many
    blocks cudaLaunchCooperativeKernel will actually place, and whether a grid_sync is cheaper than the
    kernel relaunch it replaces.'
constants:
- tag: tma.issue.warp
  unit: tma
  value: 248
  units: ns per TMA per producer warp
  short: 248 ns/txn/warp
  rule: 'Bytes per TMA is a first-class design term, not a tiling detail: doubling the box nearly doubles
    the copy column for free.'
- tag: tma.lat.warp
  unit: tma
  value: 595
  units: ns fixed plus 5.2 ns per KB of box, DRAM; 217 + 4.8 from L2
  short: 595ns + 5.2/KB (DRAM), 217 + 4.8 (L2)
  rule: 'This is the number a ring stages has to cover: stages is roughly `latency / issue_interval +
    1`, which with tma.issue.warp''s 248 ns gives 3-4 stages on DRAM and 2 on L2 -- and that is exactly
    what tma.stages.warp.knee measures.'
- tag: tma.bw.dev.dip
  unit: tma
  value: 11.5
  units: percent worst slowdown against the 32-CTA point at the same config, DRAM
  short: -11.5% at 44-56 CTAs, DRAM only
  rule: Do not interpolate a grid off the bandwidth curve in the 40-56 CTA band on cold traffic -- measure
    the grid you intend to ship.
- tag: tma.stages.warp.knee
  unit: tma
  value: 4
  units: ring stages covering 8-32 KB boxes from DRAM; 2 suffices from L2
  short: stages 4 (DRAM), 2 (L2), box-dependent
  rule: Four stages for cold weights at any box up to 32 KB, two for a cache-hot re-read.
- tag: tma.bw.cta.geom
  unit: tma
  value: 3.6
  units: percent worst-case penalty for a strided box, DRAM-sourced; 0.2 on L2
  short: <=3.6% DRAM, free on L2
  rule: Do not restructure a tensor to make a TMA box contiguous.
- tag: tma.bytes.txn.max
  unit: tma
  value: 32768
  units: bytes -- the largest single TMA under SW128, from a 128 B row cap and a 256 row cap (32 B/row
    under SW32, 64 B under SW64, unbounded unswizzled)
  short: 32 KB max box
  rule: A descriptor whose STRIDED dimension is short caps the box size and therefore caps the copy column
    via tma.issue.warp.
- tag: tma.bytes.txn.dtype
  unit: tma
  value: 128
  units: bytes of box row for SW128, at every accepted element width
  short: caps are bytes, not elements
  rule: 'Size the contiguous dimension in BYTES, not elements: 128 B per box row is 64 bfloat16, 128 fp8,
    32 float32.'
- tag: tma.bw.dev.l2
  unit: tma
  value: 18152
  units: GB/s sustained from L2 at 132 CTAs x 2 warps x 28 KB, one CTA per SM
  short: 18.2 TB/s, knee 40 KB/SM
  rule: Traffic that MULTIPLIES through L2 is nearly free -- an M-split that re-reads the same weights
    M/T_t times costs essentially nothing as long as the extra reads hit L2.
- tag: tma.bw.sm.cta.scale
  unit: tma
  value: 1.4
  units: ratio, one CTA per SM over two, at 56 KB of per-SM num_producers x box
  short: <=1.0, costs 1.40x
  rule: When a tile is fed by TMA from cache-hot memory, prefer one wide CTA over two narrow ones at the
    same shared-memory budget.
- tag: tma.ctas.dev.dram.knee
  unit: tma
  value: 128
  units: CTAs for 90% of the DRAM ceiling at 8 KB boxes; 64 at 16 KB, 32 at 32 KB
  short: 128 CTAs at 8 KB, 32 at 32 KB
  rule: 'A DRAM-bound copy at 8 KB boxes needs ~128 CTAs, not 32: there is NO large pool of SMs left over
    for math at small boxes. The original entry had this backwards.'
- tag: tma.bw.cta.warps
  unit: tma
  value: 0.9
  units: percent worst disagreement between (N x 2 warps) and (2N x 1 warp), DRAM
  short: free on DRAM, up to 22% on L2
  rule: Choose warps or CTAs on other grounds (shared memory, occupancy, warp specialisation) when the
    source is cold.
- tag: tma.bw.dev.dram
  unit: tma
  value: 3172
  units: GB/s aggregate, DRAM-sourced, L2 flushed; UPPER BOUND on the cold rate
  short: <=3.17 TB/s, cold rate lower
  rule: Divide bytes by 3.17 TB/s for an optimistic floor and by ld.bw.dev.dram's 2.77 for a conservative
    one, and say which you used.
- tag: tma.bw.dev.curve
  unit: tma
  value: 10
  units: percent 90th-percentile disagreement at exactly equal product
  short: product law to ~10%, tail 19-29%
  rule: Use the product to SIZE a configuration and then measure the one you chose; do not use it to rank
    two configurations within 10% of each other.
- tag: launch.lat.dev.ramp
  unit: launch
  value: 1.24
  units: us per launch at >= 128 CTAs (0.95 at 32, 1.20 at 64, 1.24 at 256)
  short: 1.24 us/launch
  rule: Launch COUNT is a first-class term in every fusion decision, ranking alongside bytes moved.
- tag: ld.bw.dev.dram
  unit: launch
  value: 2.77
  units: TB/s marginal, behind 1.85 us of fixed cost
  short: 1.85us + MB/2.77
  rule: Replace bytes / 3.35 TB/s with 1.85 + MB/2.77 in every floor, per launch.
- tag: ld.ctas.dev.knee
  unit: launch
  value: 128
  units: CTAs at which a 4.19 MB cold read is fastest (3.33 us)
  short: knee @128 CTA
  rule: 32 CTAs cost 1.63x what 128 do for identical bytes -- this is what justifies split-K over a coarser
    tile, and what kills a grid sized to the output tiling alone.
- tag: cluster.lat.sync
  unit: launch
  value: 0.65
  units: us per cluster_sync at cluster 8 (0.51 at cluster 4)
  short: 0.65 us/barrier
  rule: Design the NUMBER of barriers, not the cluster size.
- tag: cluster.count.max
  unit: launch
  value: 15
  units: placeable clusters of 8 at 1 CTA/SM (120 CTAs, against 132 SMs)
  short: 15 clusters of 8
  rule: A 128-CTA grid at 1 CTA/SM cannot use cluster 4 or 8 without a deadlock (if CTAs wait on each
    other) or a second wave (~2x, if they do not).
- tag: sched.ctas.sm.knee
  unit: launch
  value: 3
  units: multiple of SM count the grid needs before extra blocks/SM become warps
  short: grid >= 3x SMs
  rule: Grid = SM_count x cta_per_sm, never SM_count.
- tag: atom.ratio.ret
  unit: atomic
  value: 1.3
  units: speedup of red over atom, uncontended
  short: red is 1.30x atom
  rule: Any accumulate that does not need the old value should be `red`, not `atom` -- 30% for a one-word
    edit.
- tag: atom.ratio.place
  unit: atomic
  value: 5.4
  units: speedup of 4 B spacing over 128 B spacing at equal address count and equal sharing; 5.4-6.3 across
    three runs, the peak row does not reproduce
  short: 5.4-6.3x from packing
  rule: 'Lay a reduction out so a warp''s lanes hit ONE 128 B line and so few lanes share an address.
    Take the LOW end, not the peak: every row of the sweep reproduces to ~1% except the one the ratio
    is taken from, which read 6.30 / 5.61 / 5.39 across three runs at 0.4% within-run spread. The direction
    and the crossover at ~100 threads per address are solid; the multiple is not.'
- tag: atom.rate.addr
  unit: atomic
  value: 1.36
  units: Gop/s to one address, 33792 threads contending
  short: 1.36 Gop/s, 1 address
  rule: One global accumulator is worth 1.36 Gop/s and nothing will fix it but more accumulators.
- tag: atom.ratio.width
  unit: atomic
  value: 3.8
  units: reduction bandwidth of v4.f32 over u32 at equal op rate
  short: v4.f32 free, 3.8x bytes
  rule: Reduce in the widest atomic the data allows.
- tag: atom.ratio.scope
  unit: atomic
  value: 0.5
  units: percent worst spread across cta / gpu / sys
  short: scope is free
  rule: Choose scope for CORRECTNESS, never for speed -- there is no performance argument for narrowing
    it, and a too-narrow scope fails silently and data-dependently.
- tag: atom.lat.dev.hop
  unit: atomic
  value: 651
  units: ns per arrive->observe hop (564 ns for a plain release store)
  short: 651 ns/hop, observers free
  rule: A task-graph counter hop costs ~650 ns, which is what a task must do more work than to be worth
    ordering separately -- at tma.bw.dev.dram that is about 2 MB of traffic.
- tag: wgmma.issue.wg.ss
  unit: mma
  value: 0.502
  units: cycles per unit of N, at N >= 64 (plus a ~19-cycle per-instruction floor)
  short: 0.50 cyc/N, floor 19
  rule: Choose the wgmma N >= 64, or do not use the tensor core. At N = 8 the instruction costs 18.9 cycles
    to do 3.8 cycles of work -- 5x waste -- and the penalty is still 38% at N = 32.
- tag: wgmma.stages.wg.knee
  unit: mma
  value: 4
  units: wgmma in flight, with wait_group >= 1
  short: 4 in flight, wait >= 1
  rule: Never put `wgmma.wait_group 0` in a mainloop -- it costs 20-30% and it is the natural thing to
    write.
- tag: wgmma.ratio.sm.wg2
  unit: mma
  value: 2.0
  units: ratio of cycles per instruction, 2 warpgroups against 1
  short: 1 WG saturates
  rule: A second math warpgroup buys no tensor-core throughput.
- tag: wgmma.clock.sm
  unit: mma
  value: 850
  units: TFLOP/s bf16 observed at 94-95% of per-cycle peak
  short: ~850 TFLOP/s, 1.0-1.6 GHz
  rule: Never target a bf16 FLOP/s figure derived from 989 TFLOP/s -- it is unreachable here for clock
    reasons that have nothing to do with the kernel.
- tag: wgmma.bytes.wg.tma
  unit: mma
  status: derived
  value: 36
  units: KB of in-flight num_producers x box per math warpgroup at N = 128, bf16
  short: 36 KB in flight per WG
  rule: Budget 36 KB of in-flight per math warpgroup and then choose warps and box to reach it -- do not
    budget a warp count.
- tag: overlap.eff.sm
  unit: mma
  value: 1.25
  units: TMA issue slowdown with a concurrent wgmma warpgroup, issue-limited regime
  short: TMA 1.25x slower, wgmma 1.05x
  rule: Budget producer warps against the ratio TIMES 1.25, or expect the copy column to miss.
- tag: pipeline.ratio.sm.dep
  unit: mma
  value: 1.06
  units: ratio, coupled pipeline over its slower isolated side, contention removed
  short: barrier ~1.02-1.06x, stages dominates
  rule: Budget 1.25x for contention and ~1.05x for the dependency -- about 1.32x over the slower engine
    at four stages, not the 1.00x an L3 timeline assumes.
- tag: pipeline.stages.wg.knee
  unit: mma
  value: 4
  units: pipeline stages, TMA producer feeding a wgmma consumer, cold source
  short: 4 stages cold (3 only if L2-resident)
  rule: Four stages for a cold-fed mainloop; six if the shared memory is spare, worth a further 4%.
- tag: mma.issue.warp
  unit: mma
  value: 6.26
  units: cycles per m16n8k16 per warp, at >= 4 independent accumulators
  short: 6.26 cyc, 63% ceiling
  rule: Reaching for `mma.sync` on Hopper costs a third of the tensor core even when everything else is
    perfect.
- tag: mma.stages.warp.knee
  unit: mma
  value: 4
  units: independent accumulator sets per warp (25.14 / 6.26 = 4.02)
  short: 4 accumulators
  rule: Hold at least 4 independent accumulator sets per warp, 16 f32 registers.
- tag: mma.xover.n.wgmma
  unit: mma
  value: 32
  units: wgmma tile N at which mma.sync and wgmma break even
  short: crossover at N=32
  rule: A kernel whose output tile N is below 32 should use `mma.sync`, not `wgmma` -- worth up to 3.1x,
    and it is the opposite of the usual "use the newest instruction" instinct.
- tag: mma.feedtax.warp.ldmatrix
  unit: mma
  value: 1.18
  units: worst cycles-per-mma multiplier over register-resident, at reuse >= 0.8
  short: <=1.18x, cliff at 0.5
  rule: The ldmatrix tax does not kill the mma.sync crossover, but it does change what the crossover is
    made of. With the tax applied, mma.sync's raw throughput is 2566 FLOP/cycle/SM -- 2% BELOW wgmma m64n32k16's
    2623.
- tag: coop.lat.dev.sync
  unit: coop
  value: 1089
  units: ns per cooperative_groups grid_sync at 132 blocks x 256 threads; 1066 at 32 blocks
  short: 1.09 us per grid_sync
  rule: 'Count grid barriers the way you count launches, not the way you count __syncthreads: one costs
    ~1.09 us and the cost barely moves with grid size (1.02x over a 4x block range), so N barriers is
    an N x 1.09 us term in any persistent-kernel budget.'
- tag: coop.ctas.dev.max
  unit: coop
  value: 1056
  units: blocks at 256 threads = max_active_blocks_per_sm x SMs, exactly; 1057 is refused
  short: 1056 blocks, = the occupancy query
  rule: Size a cooperative grid from cudaOccupancyMaxActiveBlocksPerMultiprocessor x SM count and trust
    it exactly -- unlike cluster placement, the launch refuses one block past it with cudaErrorCooperativeLaunchTooLarge
    rather than deadlocking, so this bound can be queried instead of discovered.
- tag: coop.ratio.dev.relaunch
  unit: coop
  value: 1.29
  units: device-side relaunch (1400 ns) over one grid_sync (1089 ns), same grid and body
  short: a relaunch is 1.29x a grid_sync
  rule: Do NOT replace launches with grid barriers to save launch cost -- a barrier buys ~22%, not an
    order of magnitude. Persistent kernels have to earn their keep on state kept in registers and shared
    memory across phases, which this constant says nothing about.
